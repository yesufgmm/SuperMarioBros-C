name: Android Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Boost headers
        run: sudo apt-get update && sudo apt-get install -y libboost-dev

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name "sdkmanager" | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Clone SDL2
        run: |
          git clone --branch release-2.30.9 --depth 1 https://github.com/libsdl-org/SDL.git sdl2-src

      - name: Set up Android project skeleton from SDL2 template
        run: |
          mkdir -p android
          cp -r sdl2-src/android-project/* android/
          rm -rf android/app/jni/SDL
          cp -r sdl2-src android/app/jni/SDL

      - name: Copy game source into project
        run: |
          mkdir -p android/app/jni/src
          cp -r source android/app/jni/src/source
          cp -r include android/app/jni/src/include 2>/dev/null || true

      - name: Write jni/Android.mk
        run: |
          cat > android/app/jni/src/Android.mk << 'EOF'
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)

          LOCAL_MODULE := main
          SDL_PATH := ../SDL

          LOCAL_C_INCLUDES := $(LOCAL_PATH)/$(SDL_PATH)/include \
                               $(LOCAL_PATH)/source \
                               /usr/include

          LOCAL_SRC_FILES := $(SDL_PATH)/src/main/android/SDL_android_main.c \
              source/Configuration.cpp \
              source/Main.cpp \
              source/Emulation/APU.cpp \
              source/Emulation/Controller.cpp \
              source/Emulation/MemoryAccess.cpp \
              source/Emulation/PPU.cpp \
              source/SMB/SMB.cpp \
              source/SMB/SMBData.cpp \
              source/SMB/SMBEngine.cpp \
              source/Util/Video.cpp

          LOCAL_SHARED_LIBRARIES := SDL2
          LOCAL_LDLIBS := -lGLESv1_CM -lGLESv2 -llog

          include $(BUILD_SHARED_LIBRARY)
          $(call import-module,SDL)
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smb-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
